name: Tauri Build & Release

on:
    # 发版仅由推标签触发；dispatch 只做验证构建，不再保留易误发的 release 开关
    workflow_dispatch:
    push:
        tags:
            - 'v*'

jobs:
    build-tauri:
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: 'windows-latest'

        runs-on: ${{ matrix.platform }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: Verify release/version.json matches tag
              if: startsWith(github.ref, 'refs/tags/v')
              shell: bash
              run: |
                  EXPECTED="${GITHUB_REF_NAME#v}"
                  ACTUAL=$(node -p "require('./release/version.json').version")
                  if [ "$EXPECTED" != "$ACTUAL" ]; then
                    echo "::error::release/version.json 的 version ($ACTUAL) 与标签 ($EXPECTED) 不一致，请先更新 release/version.json 再打标签"
                    exit 1
                  fi

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-msvc

            - name: Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: './src-tauri -> target'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify updater signing configuration
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
              run: |
                  if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
                    throw '缺少 TAURI_SIGNING_PRIVATE_KEY，请先配置应用更新签名密钥'
                  }
                  node -e "const c = require('./src-tauri/tauri.conf.json'); if (!c.plugins.updater.pubkey) throw new Error('缺少 updater.pubkey，禁止构建不可验证的更新包')"

            - name: Generate release notes from version.json
              id: release_notes
              run: node ./scripts/gen-release-notes.mjs

            - name: Build Tauri App
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  # 仅标签构建创建 Release；dispatch 构建只出 artifact，避免误建 master 标签/发布
                  tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
                  releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('AnhePlayer {0}', github.ref_name) || '' }}
                  releaseBody: ${{ steps.release_notes.outputs.updater_notes }}
                  # 安装包、签名和清单全部校验成功后，再由最后一步公开。
                  releaseDraft: true
                  prerelease: false
                  uploadUpdaterJson: true
                  updaterJsonPreferNsis: true
                  # dispatch 验证构建跳过打包：NSIS 需要从 GitHub Releases 下载，
                  # 该外部依赖一旦 504 就会吞掉整轮编译成果；标签发版仍完整打包。
                  args: ${{ startsWith(github.ref, 'refs/tags/') && '--bundles nsis,msi' || '--no-bundle' }}

            - name: Verify signed updater artifacts
              # dispatch 构建不产出安装包，签名校验只对标签发版有意义
              if: startsWith(github.ref, 'refs/tags/v')
              run: node ./scripts/verify-updater-assets.mjs

            - name: Upload Windows Artifacts
              uses: actions/upload-artifact@v4
              # dispatch 验证构建即使卡在 NSIS 等外部下载失败，也要把已编译的 exe 传上来；
              # 标签发版仍由后续 Publish 步骤保证产物完整。
              if: always() && matrix.platform == 'windows-latest'
              with:
                  name: AnhePlayer-Tauri-Windows
                  path: |
                      src-tauri/target/release/bundle/nsis/*.exe
                      src-tauri/target/release/bundle/nsis/*.sig
                      src-tauri/target/release/bundle/msi/*.msi
                      src-tauri/target/release/bundle/msi/*.sig
                      src-tauri/target/release/*.exe
                  if-no-files-found: warn

            - name: Publish GitHub Release
              if: startsWith(github.ref, 'refs/tags/v')
              uses: softprops/action-gh-release@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  # 标签构建下 ref_name 即版本标签，不再回退到旧版本号误发
                  tag_name: ${{ github.ref_name }}
                  name: ${{ format('AnhePlayer {0}', github.ref_name) }}
                  body_path: ./release-notes.md
                  draft: false
                  prerelease: false
                  files: |
                      src-tauri/target/release/bundle/nsis/*.exe
                      src-tauri/target/release/bundle/msi/*.msi
