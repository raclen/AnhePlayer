name: Build

on:
    workflow_dispatch:

jobs:
    build-meta:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Generate build metadata
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  BRANCH=${GITHUB_REF_NAME}
                  COMMIT=${GITHUB_SHA}
                  echo "{\"branch\":\"${BRANCH}\",\"version\":\"${VERSION}\",\"commit\":\"${COMMIT}\"}" > build-meta.json
                  cat build-meta.json
            - uses: actions/upload-artifact@v6
              with:
                  name: build-meta
                  path: build-meta.json
                  retention-days: 30

    build-windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v4
              with:
                  version: 9
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Read version
              run: |
                  $version = node -p "require('./package.json').version"
                  echo "VERSION=$version" >> $env:GITHUB_ENV
            - run: pnpm run package
            - name: Prepare Inno Setup package directory
              run: |
                  $packageDir = "./out/AnhePlayer-win32-x64"
                  $innoPackageDir = "./out/anhe-player-win32-x64"
                  $preferredExe = Join-Path $packageDir "anhe-player.exe"
                  if (Test-Path $preferredExe) {
                    $exeName = "anhe-player.exe"
                  } else {
                    $exe = Get-ChildItem -Path $packageDir -Filter "*.exe" -File | Select-Object -First 1
                    if (-not $exe) {
                      Write-Error "No packaged .exe found in $packageDir"
                      exit 1
                    }
                    $exeName = $exe.Name
                  }
                  Remove-Item -Path $innoPackageDir -Recurse -Force -ErrorAction SilentlyContinue
                  Copy-Item -Path $packageDir -Destination $innoPackageDir -Recurse
                  Get-ChildItem -Path $innoPackageDir -Force | Select-Object Name, Length | Format-Table -AutoSize
                  Write-Host "Packaged executable: $exeName"
                  echo "WINDOWS_EXE_NAME=$exeName" >> $env:GITHUB_ENV
            - uses: maotoumao/inno-setup-action-cli@main
              with:
                  filepath: ./release/build-windows.iss
                  variables: /DMyAppVersion=${{ env.VERSION }} /DMyAppId=${{ secrets.MYAPPID }} /DMyAppExeName="${{ env.WINDOWS_EXE_NAME }}" /DMyAppPackageDir="..\out\anhe-player-win32-x64"
            - name: Rename setup file
              run: |
                  Rename-Item -Path "./out/AnhePlayerSetup.exe" -NewName "AnhePlayer-${{ env.VERSION }}-win32-x64-setup.exe"
            - name: Generate portable
              run: |
                  $packageDir = "./out/AnhePlayer-win32-x64"
                  New-Item -ItemType Directory -Path "$packageDir/portable" -Force
                  New-Item -ItemType File -Path "$packageDir/portable/.portable" -Force
            - name: Archive portable
              run: |
                  Compress-Archive -Path "./out/AnhePlayer-win32-x64/*" -DestinationPath "./out/AnhePlayer-${{ env.VERSION }}-win32-x64-portable.zip"
            - uses: actions/upload-artifact@v6
              with:
                  name: AnhePlayer-${{ env.VERSION }}-win32-x64-setup
                  path: ./out/AnhePlayer-${{ env.VERSION }}-win32-x64-setup.exe
                  retention-days: 30
            - uses: actions/upload-artifact@v6
              with:
                  name: AnhePlayer-${{ env.VERSION }}-win32-x64-portable
                  path: ./out/AnhePlayer-${{ env.VERSION }}-win32-x64-portable.zip
                  retention-days: 30

    build-windows-legacy:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v4
              with:
                  version: 9
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install
            - name: Read version
              run: |
                  $version = node -p "require('./package.json').version"
                  echo "VERSION=$version" >> $env:GITHUB_ENV
            - name: Override Win7 compatibility files
              run: |
                  Get-ChildItem -Recurse -Filter "*.win7.ts" | ForEach-Object {
                    $target = $_.FullName -replace '\.win7\.ts$', '.ts'
                    Write-Host "Overriding: $target"
                    Copy-Item $_.FullName $target -Force
                  }
            - name: Install Electron 22
              run: pnpm add electron@22 --save-dev -w
            - run: pnpm run package
            - name: Prepare Inno Setup package directory
              run: |
                  $packageDir = "./out/AnhePlayer-win32-x64"
                  $innoPackageDir = "./out/anhe-player-win32-x64"
                  $preferredExe = Join-Path $packageDir "anhe-player.exe"
                  if (Test-Path $preferredExe) {
                    $exeName = "anhe-player.exe"
                  } else {
                    $exe = Get-ChildItem -Path $packageDir -Filter "*.exe" -File | Select-Object -First 1
                    if (-not $exe) {
                      Write-Error "No packaged .exe found in $packageDir"
                      exit 1
                    }
                    $exeName = $exe.Name
                  }
                  Remove-Item -Path $innoPackageDir -Recurse -Force -ErrorAction SilentlyContinue
                  Copy-Item -Path $packageDir -Destination $innoPackageDir -Recurse
                  Get-ChildItem -Path $innoPackageDir -Force | Select-Object Name, Length | Format-Table -AutoSize
                  Write-Host "Packaged executable: $exeName"
                  echo "WINDOWS_EXE_NAME=$exeName" >> $env:GITHUB_ENV
            - uses: maotoumao/inno-setup-action-cli@main
              with:
                  filepath: ./release/build-windows.iss
                  variables: /DMyAppVersion=${{ env.VERSION }} /DMyAppId=${{ secrets.MYAPPID }} /DMyAppExeName="${{ env.WINDOWS_EXE_NAME }}" /DMyAppPackageDir="..\out\anhe-player-win32-x64"
            - name: Rename setup file
              run: |
                  Rename-Item -Path "./out/AnhePlayerSetup.exe" -NewName "AnhePlayer-${{ env.VERSION }}-win32-x64-legacy-setup.exe"
            - name: Generate portable
              run: |
                  $packageDir = "./out/AnhePlayer-win32-x64"
                  New-Item -ItemType Directory -Path "$packageDir/portable" -Force
                  New-Item -ItemType File -Path "$packageDir/portable/.portable" -Force
            - name: Archive portable
              run: |
                  Compress-Archive -Path "./out/AnhePlayer-win32-x64/*" -DestinationPath "./out/AnhePlayer-${{ env.VERSION }}-win32-x64-legacy-portable.zip"
            - uses: actions/upload-artifact@v6
              with:
                  name: AnhePlayer-${{ env.VERSION }}-win32-x64-legacy-setup
                  path: ./out/AnhePlayer-${{ env.VERSION }}-win32-x64-legacy-setup.exe
                  retention-days: 30
            - uses: actions/upload-artifact@v6
              with:
                  name: AnhePlayer-${{ env.VERSION }}-win32-x64-legacy-portable
                  path: ./out/AnhePlayer-${{ env.VERSION }}-win32-x64-legacy-portable.zip
                  retention-days: 30

    build-macos-x64:
        runs-on: macos-15-intel
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v4
              with:
                  version: 9
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm
            - name: Fix node-gyp for Python 3.12+
              run: pip install setuptools
            - run: pnpm install --frozen-lockfile
            - name: Read version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "VERSION=$VERSION" >> $GITHUB_ENV
            - run: pnpm run make
            - name: Rename DMG
              run: |
                  DMG_FILE=$(find ./out/make -maxdepth 1 -name "*.dmg" | head -1)
                  if [ -z "$DMG_FILE" ]; then
                    echo "::error::DMG file not found"
                    exit 1
                  fi
                  mv "$DMG_FILE" "./out/make/AnhePlayer-${{ env.VERSION }}-darwin-x64.dmg"
            - uses: actions/upload-artifact@v6
              with:
                  name: AnhePlayer-${{ env.VERSION }}-darwin-x64
                  path: ./out/make/AnhePlayer-${{ env.VERSION }}-darwin-x64.dmg
                  retention-days: 30

    build-macos-arm64:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v4
              with:
                  version: 9
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm
            - name: Fix node-gyp for Python 3.12+
              run: pip install setuptools
            - run: pnpm install --frozen-lockfile
            - name: Read version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "VERSION=$VERSION" >> $GITHUB_ENV
            - run: pnpm run make -- --arch=arm64
            - name: Rename DMG
              run: |
                  DMG_FILE=$(find ./out/make -maxdepth 1 -name "*.dmg" | head -1)
                  if [ -z "$DMG_FILE" ]; then
                    echo "::error::DMG file not found"
                    exit 1
                  fi
                  mv "$DMG_FILE" "./out/make/AnhePlayer-${{ env.VERSION }}-darwin-arm64.dmg"
            - uses: actions/upload-artifact@v6
              with:
                  name: AnhePlayer-${{ env.VERSION }}-darwin-arm64
                  path: ./out/make/AnhePlayer-${{ env.VERSION }}-darwin-arm64.dmg
                  retention-days: 30

    build-linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Install system dependencies
              run: sudo apt-get update && sudo apt-get install -y rpm
            - uses: pnpm/action-setup@v4
              with:
                  version: 9
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Read version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "VERSION=$VERSION" >> $GITHUB_ENV
            - run: pnpm run make
            - name: Rename DEB
              run: |
                  DEB_FILE=$(find ./out/make/deb/x64/ -name "*.deb" | head -1)
                  if [ -z "$DEB_FILE" ]; then
                    echo "::error::DEB file not found"
                    exit 1
                  fi
                  mv "$DEB_FILE" "./out/make/deb/x64/AnhePlayer-${{ env.VERSION }}-linux-amd64.deb"
            - name: Rename RPM
              run: |
                  RPM_FILE=$(find ./out/make/rpm/x64/ -name "*.rpm" | head -1)
                  if [ -z "$RPM_FILE" ]; then
                    echo "::error::RPM file not found"
                    exit 1
                  fi
                  mv "$RPM_FILE" "./out/make/rpm/x64/AnhePlayer-${{ env.VERSION }}-linux-amd64.rpm"
            - uses: actions/upload-artifact@v6
              with:
                  name: AnhePlayer-${{ env.VERSION }}-linux-amd64-deb
                  path: ./out/make/deb/x64/AnhePlayer-${{ env.VERSION }}-linux-amd64.deb
                  retention-days: 30
            - uses: actions/upload-artifact@v6
              with:
                  name: AnhePlayer-${{ env.VERSION }}-linux-amd64-rpm
                  path: ./out/make/rpm/x64/AnhePlayer-${{ env.VERSION }}-linux-amd64.rpm
                  retention-days: 30
